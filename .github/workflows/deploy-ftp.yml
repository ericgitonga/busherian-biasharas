name: Deploy to Angryhosting via FTPS

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'bin/**'
      - 'VERSION'
      - '.github/workflows/deploy-ftp.yml'
      - '.github/scripts/ftps_deploy.py'
      - '.github/scripts/letsencrypt_geny_intermediates.pem'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Upload all tracked public/, src/, and bin/ files instead of only commit diff'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-deploy-busherian-biasharas
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload Application Files to Angryhosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect pertinent changed files & lint PHP
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SYNC_ALL" = "true" ]; then
            git ls-files public src bin VERSION > /tmp/changed_files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$AFTER_SHA" -- public src bin VERSION > /tmp/changed_files.txt
          else
            git ls-files public src bin VERSION > /tmp/changed_files.txt
          fi

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ] && [[ "$file" == *.php ]]; then
              php -l "$file"
            fi
          done < /tmp/changed_files.txt

      - name: Upload files via Explicit FTPS (Verified TLS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_APP_ROOT: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          TLS_ARG=()
          if [[ "${FTP_SERVER}" != "angryhosting.com" && "${FTP_SERVER}" != *.angryhosting.com ]]; then
            TLS_ARG=(--tls-servername "angryhosting.com")
          fi
          python3 .github/scripts/ftps_deploy.py --mode prod --files-list /tmp/changed_files.txt "${TLS_ARG[@]}"
