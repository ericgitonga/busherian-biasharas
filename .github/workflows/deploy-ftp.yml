name: Deploy to Angryhosting via FTPS

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'bin/**'
      - 'VERSION'
      - '.github/workflows/deploy-ftp.yml'
      - '.github/scripts/ftps_deploy.py'
      - '.github/scripts/letsencrypt_geny_intermediates.pem'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Upload all tracked public/, src/, and bin/ files instead of only commit diff'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-deploy-busherian-biasharas
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload Application Files to Angryhosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect pertinent changed & retired files & lint PHP
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: |
          set -euo pipefail
          : > /tmp/deleted_files.txt
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SYNC_ALL" = "true" ]; then
            git ls-files public src bin VERSION > /tmp/changed_files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            git diff -M --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$AFTER_SHA" -- public src bin VERSION > /tmp/changed_files.txt
            git diff -M --name-status "$BEFORE_SHA" "$AFTER_SHA" -- public src bin | python3 .github/scripts/ftps_deploy.py --mode prod --extract-retired-from-stdin > /tmp/deleted_files.txt
          elif git rev-parse --verify origin/main^ >/dev/null 2>&1; then
            git diff -M --name-only --diff-filter=ACMRT origin/main^ "$AFTER_SHA" -- public src bin VERSION > /tmp/changed_files.txt
            git diff -M --name-status origin/main^ "$AFTER_SHA" -- public src bin | python3 .github/scripts/ftps_deploy.py --mode prod --extract-retired-from-stdin > /tmp/deleted_files.txt
          else
            git ls-files public src bin VERSION > /tmp/changed_files.txt
          fi
          grep -v '^public/assets/photos/' /tmp/changed_files.txt > /tmp/changed_files_filtered.txt && mv /tmp/changed_files_filtered.txt /tmp/changed_files.txt || true

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ] && [[ "$file" == *.php ]]; then
              php -l "$file"
            fi
          done < /tmp/changed_files.txt

      - name: Upload files via Atomic Explicit FTPS (Verified TLS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_APP_ROOT: ${{ secrets.FTP_SERVER_DIR }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TLS_ARG=()
          if [[ "${FTP_SERVER}" != "angryhosting.com" && "${FTP_SERVER}" != *.angryhosting.com ]]; then
            TLS_ARG=(--tls-servername "angryhosting.com")
          fi
          python3 - << 'PYEOF'
          import io, os, sys
          sys.path.insert(0, ".github/scripts")
          from ftps_deploy import connect_verified_ftps
          host = os.environ["FTP_SERVER"]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          try:
              ftp = connect_verified_ftps(host, user, password, cafile=".github/scripts/letsencrypt_geny_intermediates.pem")
              buf = io.BytesIO()
              ftp.retrbinary("RETR /busherianbiasharas.com/www/.env", buf.write)
              raw = buf.getvalue().decode("utf-8", errors="replace")
              if raw.strip():
                  creds = {}
                  if os.environ.get("GOOGLE_CLIENT_ID"):
                      creds["GOOGLE_CLIENT_ID"] = os.environ["GOOGLE_CLIENT_ID"].strip()
                  if os.environ.get("GOOGLE_CLIENT_SECRET"):
                      creds["GOOGLE_CLIENT_SECRET"] = os.environ["GOOGLE_CLIENT_SECRET"].strip()
                  lines = []
                  seen = set()
                  for line in raw.splitlines():
                      t = line.strip()
                      if t == "" or t.startswith("#") or "=" not in t:
                          lines.append(line)
                          continue
                      k, _ = t.split("=", 1)
                      k = k.strip()
                      if k in creds:
                          lines.append(f"{k}={creds[k]}")
                          seen.add(k)
                      else:
                          lines.append(line)
                          seen.add(k)
                  for k, v in creds.items():
                      if k not in seen:
                          lines.append(f"{k}={v}")
                  updated = ("\n".join(lines) + "\n").encode("utf-8")
                  ftp.storbinary("STOR /busherianbiasharas.com/www/.env", io.BytesIO(updated))
                  print("Production .env Google SSO credentials synced.")
              ftp.quit()
          except Exception as e:
              print(f"Notice: .env Google SSO sync: {e}")
          PYEOF
          python3 .github/scripts/ftps_deploy.py --mode prod --files-list /tmp/changed_files.txt --deleted-files-list /tmp/deleted_files.txt --release-sha "${GITHUB_SHA}" "${TLS_ARG[@]}"

      - name: Verify live production HTTP & schema readiness (#251)
        run: |
          set -euo pipefail
          EXPECTED_VER="$(tr -d '[:space:]' < VERSION)"
          python3 - "$EXPECTED_VER" << 'PYEOF'
          import json, sys, time, urllib.request

          expected_ver = sys.argv[1]
          url = "https://www.busherianbiasharas.com/api/health.php?verify_schema=1"
          last_err = ""
          for attempt in range(1, 7):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "BusherianDeployReadiness/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      data = json.loads(body)
                      if resp.status == 200 and data.get("status") == "ok" and data.get("schema_ready") is True and data.get("version") == expected_ver:
                          print(f"Live readiness verified on attempt {attempt}: version={data.get('version')}, schema_version={data.get('schema_version')}")
                          sys.exit(0)
                      last_err = f"HTTP {resp.status}: {body}"
              except Exception as exc:
                  last_err = str(exc)
              time.sleep(3)
          print(f"ERROR: Post-deploy readiness check failed: {last_err}", file=sys.stderr)
          sys.exit(1)
          PYEOF
