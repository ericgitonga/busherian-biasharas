name: Deploy to Angryhosting via FTPS

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'bin/**'
      - 'VERSION'
      - '.github/workflows/deploy-ftp.yml'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Upload all tracked public/, src/, and bin/ files instead of only commit diff'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-deploy-busherian-biasharas
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload Application Files to Angryhosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect pertinent changed files & lint PHP
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SYNC_ALL" = "true" ]; then
            git ls-files public src bin VERSION > /tmp/changed_files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$AFTER_SHA" -- public src bin VERSION > /tmp/changed_files.txt
          else
            git ls-files public src bin VERSION > /tmp/changed_files.txt
          fi

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ] && [[ "$file" == *.php ]]; then
              php -l "$file"
            fi
          done < /tmp/changed_files.txt

      - name: Upload files via Explicit FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_APP_ROOT: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - << 'PYEOF'
          import ftplib, os, posixpath, sys

          with open("/tmp/changed_files.txt", "r", encoding="utf-8") as f:
              files = [line.strip() for line in f if line.strip() and os.path.isfile(line.strip())]

          if not files:
              print("No pertinent files changed; skipping FTPS upload.")
              sys.exit(0)

          host = os.environ["FTP_SERVER"]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          app_root = (os.environ.get("FTP_APP_ROOT") or "/busherianbiasharas.com/www").rstrip("/")

          ftp = ftplib.FTP_TLS()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)
          ftp.prot_p()

          def ensure_remote_dir(remote_dir):
              parts = [p for p in remote_dir.split("/") if p]
              curr = ""
              for part in parts:
                  curr = f"{curr}/{part}"
                  try:
                      ftp.cwd(curr)
                  except ftplib.error_perm:
                      ftp.mkd(curr)
                      ftp.cwd(curr)

          uploaded = 0
          for rel_path in files:
              if rel_path.startswith("public/"):
                  sub = rel_path[len("public/"):]
                  remote_full = f"{app_root}/html/{sub}"
              else:
                  remote_full = f"{app_root}/{rel_path}"

              remote_dir = posixpath.dirname(remote_full)
              remote_filename = posixpath.basename(remote_full)
              ensure_remote_dir(remote_dir)
              with open(rel_path, "rb") as lf:
                  ftp.storbinary(f"STOR {remote_filename}", lf)
              print(f"Uploaded: {rel_path} -> {remote_full}")
              uploaded += 1

          ftp.quit()
          print(f"Successfully uploaded {uploaded} file(s).")
          PYEOF
