name: Deploy Pre-Prod Sandbox to Angryhosting (/admin/preprod)

on:
  push:
    branches:
      - preprod
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Upload all tracked public/, src/, and bin/ files to /admin/preprod'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ftp-deploy-busherian-biasharas-preprod
  cancel-in-progress: true

jobs:
  deploy-preprod:
    name: Upload Pre-Prod Sandbox to /admin/preprod via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Stage Pre-Prod build, detect retired files & lint all PHP files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > /tmp/preprod_deleted_files.txt
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=D "$BEFORE_SHA" "$AFTER_SHA" -- public src bin | grep -vE '^(public/)?uploads/' > /tmp/preprod_deleted_files.txt || true
          fi
          python3 - << 'PYEOF'
          import os, pathlib, shutil, subprocess

          stage = pathlib.Path("/tmp/preprod_stage")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          tracked = subprocess.check_output(
              ["git", "ls-files", "public", "src", "bin", "VERSION"],
              text=True
          ).splitlines()

          for rel in tracked:
              rel = rel.strip()
              if not rel or not os.path.isfile(rel):
                  continue
              dst = stage / rel
              dst.parent.mkdir(parents=True, exist_ok=True)

              if rel.startswith("public/") and rel.endswith(".php"):
                  src_txt = pathlib.Path(rel).read_text(encoding="utf-8")
                  sub_parts = rel[len("public/"):].split("/")
                  depth = len(sub_parts) - 1  # 0 for public/*.php, 1 for public/admin/*.php etc.
                  up_levels = 3 + depth
                  pub_root_expr = "__DIR__" if depth == 0 else f"dirname(__DIR__, {depth})"
                  boot_snippet = (
                      "if (!defined('BBIZ_PREPROD_MODE')) { "
                      "define('BBIZ_PREPROD_MODE', true); "
                      "define('BBIZ_PREPROD_BASE_PATH', '/admin/preprod'); "
                      f"define('BBIZ_PROD_ENV_PATH', dirname(__DIR__, {up_levels}) . '/.env'); "
                      f"define('BBIZ_PREPROD_PUBLIC_ROOT', {pub_root_expr}); "
                      "} "
                      f"require_once dirname(__DIR__, {up_levels}) . '/preprod_app/src/bootstrap.php';"
                  )
                  src_txt = src_txt.replace("require_once dirname(__DIR__) . '/src/bootstrap.php';", boot_snippet)
                  src_txt = src_txt.replace("require_once dirname(__DIR__, 2) . '/src/bootstrap.php';", boot_snippet)
                  dst.write_text(src_txt, encoding="utf-8")
              else:
                  shutil.copy2(rel, dst)

          # Lint every staged PHP file
          for php_file in stage.rglob("*.php"):
              subprocess.run(["php", "-l", str(php_file)], check=True)
          print("Staged & linted all Pre-Prod files cleanly.")
          PYEOF

      - name: Upload Pre-Prod files via Atomic Explicit FTPS (TLS Verified)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_APP_ROOT: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          TLS_ARG=()
          if [[ "${FTP_SERVER}" != "angryhosting.com" && "${FTP_SERVER}" != *.angryhosting.com ]]; then
            TLS_ARG=(--tls-servername "angryhosting.com")
          fi
          python3 .github/scripts/ftps_deploy.py --mode preprod --stage-dir /tmp/preprod_stage --deleted-files-list /tmp/preprod_deleted_files.txt --release-sha "${GITHUB_SHA}" "${TLS_ARG[@]}"
